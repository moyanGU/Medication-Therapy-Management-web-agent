# Redis configuration for local development
bind 127.0.0.1
port 6379

daemonize no

dir .

dbfilename dump.rdb

# 安全：不要在仓库中存放明文口令
# 如需启用密码，请在启动命令通过 --requirepass 或环境变量传入
# 示例（批处理）：
#   set REDIS_PASSWORD=***
#   redis-server.exe "%~dp0redis.conf" --requirepass %REDIS_PASSWORD%

# 持久化配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly no
appendfsync everysec