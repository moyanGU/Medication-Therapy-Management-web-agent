# Redis configuration for local development
bind 127.0.0.1
port 6379

daemonize no

dir .

dbfilename dump.rdb

# 设置强密码，需与后端 .env 的 REDIS_PASSWORD 保持一致
requirepass ghp880218

# 持久化配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly no
appendfsync everysec