# Redis configuration for local development
bind 127.0.0.1
port 6379

daemonize no

dir .

dbfilename dump.rdb

# 设置密码请通过环境变量或外部配置传入，仓库不存放明文口令
# requirepass <YOUR_SECURE_PASSWORD>

# 持久化配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly no
appendfsync everysec