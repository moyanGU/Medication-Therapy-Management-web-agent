# Nginx production template for mtm-helper.com
# - HTTP: only ACME challenge + 301 redirect to HTTPS
# - HTTPS: serve SPA, static/media, and proxy /api to backend

# 使用容器日志输出，避免 /var/log/nginx 权限问题
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_tokens off;
  client_max_body_size 10m;

  # 发送访问日志到 stdout，方便通过 Docker 日志采集
  access_log /dev/stdout;

  # Upstream backend
  upstream backend {
    server backend:8000;
    keepalive 32;
  }

  limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
  limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=2r/s;

  # HTTP → HTTPS，仅放行 ACME 挑战
  server {
    listen 80 default_server;
    server_name mtm-helper.com www.mtm-helper.com;

    # ACME challenge (plain text, no cache)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # 其他路径重定向到 HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name mtm-helper.com www.mtm-helper.com;

    ssl_certificate     /etc/letsencrypt/live/mtm-helper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtm-helper.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge on HTTPS (for renew)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Static and media
    location /static/ {
      alias /var/www/static/;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
      alias /var/www/media/;
      access_log off;
      add_header Cache-Control "public, max-age=3600";
    }
    # PWA icons and assets: if not found, return 404 rather than falling back to index.html
    # This prevents requests like /icons/app-icon.svg from serving HTML content.
    location ^~ /icons/ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API proxy to backend
    location /api/ {
      limit_conn perip_conn 30;
      limit_req zone=api_ratelimit burst=30 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Forward Authorization for JWT/session auth
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
    }

    location ^~ /api/auth/ {
      limit_conn perip_conn 15;
      limit_req zone=auth_ratelimit burst=10 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
    }

    # Frontend SPA
    root /var/www/app;
    index index.html;

    # Explicit SPA route for /webui/ to avoid potential rewrite loops
    # Some scanners or direct IP hits may request /webui/ and trigger unusual behaviors.
    # This ensures /webui/ behaves like other SPA routes and falls back to index.html.
    location ^~ /webui/ {
      try_files $uri $uri/ /index.html;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # HTTP → HTTPS for api.mtm-helper.com, allow ACME challenge
  server {
    listen 80;
    server_name api.mtm-helper.com;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server for api.mtm-helper.com
  server {
    listen 443 ssl;
    http2 on;
    server_name api.mtm-helper.com;

    ssl_certificate     /etc/letsencrypt/live/api.mtm-helper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mtm-helper.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /static/ {
      alias /var/www/static/;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
      alias /var/www/media/;
      access_log off;
      add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /icons/ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Django Admin under /admin/
    location /admin/ {
      limit_conn perip_conn 15;
      limit_req zone=auth_ratelimit burst=10 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    # API proxy
    location /api/ {
      limit_conn perip_conn 30;
      limit_req zone=api_ratelimit burst=30 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
    }

    location ^~ /api/auth/ {
      limit_conn perip_conn 15;
      limit_req zone=auth_ratelimit burst=10 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
    }

    # SPA root
    root /var/www/app;
    index index.html;

    location ^~ /webui/ {
      try_files $uri $uri/ /index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
