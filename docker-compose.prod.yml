version: '3.8'

# 生产环境增量覆盖模板：与基础 docker-compose.yml 合并使用
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d

services:
  # 明确将前端开发服务器置于 dev，仅生产不启用该容器
  frontend:
    profiles: ["dev"]

  # 本地 MySQL 仅用于开发环境，生产改连外部 RDS
  mysql:
    profiles: ["dev"]

  # 后端服务（Gunicorn）
  backend:
    restart: always
    env_file:
      - .env.prod
    environment:
      - DEBUG=False
      # RDS 连接信息从环境注入
      - DB_HOST=${DB_HOST:-db-prod.mtm-helper.com}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # 数据库连接与超时基线（与 DESIGN/TASK 对齐，可按需在 .env 中覆盖）
      - DB_CONN_MAX_AGE=${DB_CONN_MAX_AGE:-120}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-5}
      - DB_READ_TIMEOUT=${DB_READ_TIMEOUT:-15}
      # Redis 统一从环境注入
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # 安全相关（域名清单写入 .env）
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-mtm-helper.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://mtm-helper.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://mtm-helper.com}
    command: >-
      gunicorn app.wsgi:application
      -w ${GUNICORN_WORKERS:-3}
      -k gthread --threads ${GUNICORN_THREADS:-2}
      -b 0.0.0.0:8000
      --timeout ${GUNICORN_TIMEOUT:-60}
      --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-30}
    # 生产环境不需要源码热更新卷，保留静态与媒体卷
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    healthcheck:
      # 使用 Python TCP 探活，避免 curl/wget 不存在
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    profiles: ["production"]

  # 提醒调度 Worker（独立进程）
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - redis
    env_file:
      - .env.prod
    environment:
      - DB_HOST=${DB_HOST:-db-prod.mtm-helper.com}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: python manage.py run_reminder_worker
    restart: always
    profiles: ["production"]

  # Redis 在生产环境不暴露宿主端口，密码从 .env 注入
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: []
    profiles: ["production"]

  # Nginx 生产反代与静态托管
  nginx:
    restart: always
    depends_on:
      - backend
    # 前端静态与后端静态/媒体卷挂载
    volumes:
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    profiles: ["production"]

  # Certbot（可选：签发与续期，首次签发请按文档执行）
  certbot:
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh","-c"]
    command: "trap : TERM INT; while :; do certbot renew --webroot -w /var/www/certbot --quiet && nginx -s reload || true; sleep 12h; done"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - nginx
    profiles: ["production"]

volumes:
  backend_media:
  backend_static: