version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - mtm-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    environment:
      - DEBUG=True
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - mtm-network

  # MySQL数据库
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=Ghp880218
      - MYSQL_DATABASE=mtm_helper
      - MYSQL_USER=mtm_user
      - MYSQL_PASSWORD=mtm_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mtm-network

  # Redis缓存
  redis:
    image: redis:7.0-alpine
    command: redis-server --requirepass Med_Helper_Redis_2025!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mtm-network

  # Nginx代理（生产环境）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - backend_static:/var/www/static
      - backend_media:/var/www/media
    depends_on:
      - frontend
      - backend
    networks:
      - mtm-network
    profiles:
      - production

volumes:
  mysql_data:
  redis_data:
  backend_media:
  backend_static:

networks:
  mtm-network:
    driver: bridge