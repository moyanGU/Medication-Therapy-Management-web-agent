<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
    <defs>
        <!-- Background Soft Gradients -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="40%" stop-color="#f1f5f9" />
            <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#0ea5e9" />
        </linearGradient>
        
        <linearGradient id="glowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#34d399" />
        </linearGradient>

        <!-- Brand Icon Gradients -->
        <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" /> <!-- Blue 700 -->
            <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue 500 -->
        </linearGradient>
        
        <linearGradient id="secondary" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#047857" /> <!-- Emerald 700 -->
            <stop offset="100%" stop-color="#10b981" /> <!-- Emerald 500 -->
        </linearGradient>
        
        <!-- Filters -->
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
        
        <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#1e40af" flood-opacity="0.15"/>
        </filter>

        <filter id="hugeBlur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="80"/>
        </filter>
    </defs>

    <!-- Base Canvas -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <!-- Subtle Tech/Medical Grid Background -->
    <g opacity="0.15" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8">
        <!-- Horizontal Lines -->
        <line x1="0" y1="180" x2="1920" y2="180"/>
        <line x1="0" y1="360" x2="1920" y2="360"/>
        <line x1="0" y1="540" x2="1920" y2="540"/>
        <line x1="0" y1="720" x2="1920" y2="720"/>
        <line x1="0" y1="900" x2="1920" y2="900"/>
        
        <!-- Vertical Lines -->
        <line x1="320" y1="0" x2="320" y2="1080"/>
        <line x1="640" y1="0" x2="640" y2="1080"/>
        <line x1="1280" y1="0" x2="1280" y2="1080"/>
        <line x1="1600" y1="0" x2="1600" y2="1080"/>
    </g>

    <!-- Abstract Ambient Glows -->
    <circle cx="400" cy="200" r="400" fill="url(#glowGrad1)" opacity="0.15" filter="url(#hugeBlur)"/>
    <circle cx="1500" cy="800" r="500" fill="url(#glowGrad2)" opacity="0.15" filter="url(#hugeBlur)"/>

    <!-- Central Focus Area (Glassmorphism Concept) -->
    <rect x="560" y="240" width="800" height="600" rx="48" fill="#ffffff" filter="url(#softShadow)"/>
    
    <!-- Central Icon Composition -->
    <g transform="translate(960, 440)">
        <g filter="url(#iconShadow)">
            <!-- Left intersecting pill (Blue) -->
            <rect x="-40" y="-120" width="80" height="240" rx="40" fill="url(#primary)" transform="rotate(45)" opacity="0.95"/>
            <!-- Right intersecting pill (Emerald/Green) -->
            <rect x="-40" y="-120" width="80" height="240" rx="40" fill="url(#secondary)" transform="rotate(-45)" opacity="0.95"/>
        </g>
        
        <!-- Central Pure White Accent (Medical Cross) -->
        <path d="M -16 -6 L -6 -6 L -6 -16 L 6 -16 L 6 -6 L 16 -6 L 16 6 L 6 6 L 6 16 L -6 16 L -6 6 L -16 6 Z" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Typography -->
    <g transform="translate(960, 680)">
        <!-- Brand Name -->
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="4" text-anchor="middle">
            <tspan fill="#1e40af">MTM</tspan>
            <tspan fill="#0f172a"> Helper</tspan>
        </text>
        
        <!-- Subtitle -->
        <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="10" text-anchor="middle" fill="#64748b">智能药品管理系统</text>
    </g>

    <!-- Elegant Divider -->
    <line x1="840" y1="780" x2="1080" y2="780" stroke="url(#primary)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
