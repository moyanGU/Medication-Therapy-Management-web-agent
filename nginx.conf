# Nginx production template for mtm-helper.com
# - First-run HTTP only for ACME validation
# - Enable HTTPS server block after certificate is issued

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_tokens off;
  client_max_body_size 10m;

  # Disable gzip to ensure plain-text ACME challenge delivery
  gzip off;

  # Upstream backend (kept for later HTTPS config)
  upstream backend {
    server backend:8000;
    keepalive 32;
  }

  # HTTP server for initial certificate issuance
  server {
    listen 80 default_server;
    server_name mtm-helper.com www.mtm-helper.com;

    # ACME challenge (highest priority, plain text, no cache)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # For all other paths, redirect to HTTPS (ACME path above is exempt)
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server block (enabled after certificate issuance)
  server {
    listen 443 ssl;
    http2 on;
    server_name mtm-helper.com www.mtm-helper.com;

    ssl_certificate /etc/letsencrypt/live/mtm-helper.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtm-helper.com-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (enable HSTS on HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge on HTTPS as well (used during renew)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Static and media
    location /static/ {
      alias /var/www/static/;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
      alias /var/www/media/;
      access_log off;
      add_header Cache-Control "public, max-age=3600";
    }

    # API proxy to backend
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
    }

    # Frontend SPA
    root /var/www/app;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}