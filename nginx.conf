# Nginx production template for mtm-helper.com
# - HTTP only for first run and ACME validation
# - Enable HTTPS server block after certificate is issued to /etc/letsencrypt/live/mtm-helper.com/

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 4096;
  server_tokens off;
  client_max_body_size 10m;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;

  upstream backend {
    server backend:8000;
  }

  # HTTP server (first-run & ACME validation)
  server {
    listen 80;
    server_name mtm-helper.com;

    # ACME challenge
    location ^~ /.well-known/acme-challenge/ {
      alias /var/www/certbot/.well-known/acme-challenge/;
      default_type "text/plain";
      try_files $uri =404;
    }

    # Static and media
    location /static/ {
      alias /var/www/static/;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
      alias /var/www/media/;
      access_log off;
      add_header Cache-Control "public, max-age=3600";
    }

    # API proxy
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
    }

    # Frontend SPA (optional; mount /var/www/app to serve dist)
    root /var/www/app;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Security headers (no HSTS on HTTP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:;" always;

    # IMPORTANT: do NOT enable redirect until certificate is issued
    # return 301 https://$host$request_uri;
  }

